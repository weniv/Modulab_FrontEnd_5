<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // 특정 순서의 피보나치수를 구하는 함수
        function fFunc(n) {
            if (n === 1 || n === 2) {
                return 1;
            } else {
                return fFunc(n - 1) + fFunc(n - 2)
            }
        }

        fFunc(5);

        // fFunc(4) + fFunc(3)
        // fFunc(3) + fFunc(2) + fFunc(2) + fFunc(1)
        // fFunc(2) + fFunc(1) + fFunc(2) + fFunc(2) + fFunc(1) ==> 5


        const memory = [0, 0, 0, 0, 0, 0, 0];

        function fFuncM(n) {
            if (n === 1 || n === 2) {
                return 1;
            } else if (memory[n] !== 0) {
                return memory[n];
            } else {
                memory[n] = fFuncM(n - 1) + fFuncM(n - 2);
                return memory[n];
            }
        }

        // fFuncM(6)
        // fFuncM(5) + fFuncM(4)
        // [0, 0, 0, 2, 3, 5, 8]
    </script>
</body>

</html>
