<form action="" method="get">
    <input type="text" name="username" value="aaa" />
    <input type="password" name="password" value="bbb" />
    <input type="submit" value="Login" />
</form>
<!--

http://127.0.0.1:5500/http/002.html?username=aaa&password=bbb 이렇게 전송이 되었습니다.

1. action이 비어있으면 현재 페이지로 전송이 됩니다. action='서버주소'이렇게 만약 서버주소가 있었다면 http://127.0.0.1:5500/http/002.html?username=aaa&password=bbb 이 데이터가 실제로는 서버로 전송이 되어야 한다고 생각하시면 됩니다.

2. method='get'이라는 것은 무엇을 의미할까요? get을 단지 '요청' 또는 '읽기'로만 생각하시는 것은 부분적인 것만 파악하고 있는 것입니다. 나중에 패킷이라는 것을 배우시게 될텐데 'get', 'post', 'delete', 'put', 'patch' 등은 단지 이 패킷에 명시되는 문자열일 뿐입니다. 그런데 대부분 'get'을 서버쪽에서 '읽기'로 처리할 뿐입니다. 이것을 '생성'으로 처리할 수도 있습니다. 즉, 프론트엔드 개발자와 백엔드 개발자 간의 약속일 뿐이지, 강제성이 없습니다.
보통은 get은 URL로만 데이터를 보내고, post는 body에 데이터를 담아서 보냅니다. 그런데 이것도 강제성이 없습니다. get인데 body에 데이터를 담아서 보내도 됩니다. 보안상 모든 데이터를 post로만 처리하는 곳도 있습니다.

3. 왜 form은 get과 post만 있을까요? form은 사용자가 작성을 해서 요청하는 것입니다. 예를 들어, delete와 같은 것은 form을 작성하여 요청하는 것이 아닙니다. 그러니 button 같은 것으로 구현이 되어야 합니다. 그래서 form에 메서드가 get과 post만 있는 것입니다. 

-->
