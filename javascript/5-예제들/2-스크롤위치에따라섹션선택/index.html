<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      margin: 0;
    }
    #info {
      position: fixed;
      left: 20px;
      top: 20px;
    }
    .section {
      box-sizing: border-box;
      height: 100vh;
      padding: 5rem;
      border: 1px solid black;
    }
    .section:nth-child(odd) {
      text-align: right;
      background: pink;
    }
    .progress {
      position: fixed;
      left: 0;
      top: 0;
      width: 0px;
      height: 10px;
      background: blue;
    }
    .star {
      position: fixed;
      left: 50px;
      top: 50px;
      font-size: 100px;
      transform-origin: center;
    }
  </style>
</head>
<body>
  <p id="info">info</p>

  <div class="progress"></div>
  <div class="star">💩</div>

  <div class="sections">
    <section class="section">
      <h2>Section 0</h2>
    </section>
    <section class="section">
      <h2>Section 1</h2>
    </section>
    <section class="section">
      <h2>Section 2</h2>
    </section>
    <section class="section">
      <h2>Section 3</h2>
    </section>
    <section class="section">
      <h2>Section 4</h2>
    </section>
  </div>

  <script>
    // 'use strict';
    const info = document.getElementById('info');
    const progress = document.querySelector('.progress');
    const star = document.querySelector('.star');
    let currentSection = 0;

    window.addEventListener('scroll', e => {
      info.innerHTML = `
        현재 스크롤 위치(window.scrollY): ${window.scrollY}<br>
        현재 스크롤 위치 / 브라우저 창 높이: ${window.scrollY / window.innerHeight} 
      `;

      const newSection = Math.round(window.scrollY / window.innerHeight);
      // console.log(newSection);

      if (currentSection !== newSection) {
        console.log('새 섹션 진입');
        console.log(`currentSection: ${currentSection}, newSection: ${newSection}`);
        currentSection = newSection;
        // 새 섹션 진입 시 실행할 코드 작성
        showEffect(newSection);
      }
    });

    function showEffect(index) {
      console.log(`${index}번 섹션에서 뭔가 하기`);
    }

    showEffect(currentSection);

  </script>
</body>
</html>
