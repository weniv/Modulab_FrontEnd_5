<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      margin: 0;
    }
    .panel-3d-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      perspective: 1000px;
    }
    .panel-3d {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 80vw;
      height: 80vh;
      font-size: 50px;
      background: rgba(0, 0, 255, 0.5);
      /* transform: rotateX(40deg); */
    }
    #info {
      position: fixed;
      left: 30px;
      top: 30px;
    }
  </style>
</head>
<body>
  <p id="info"></p>

  <div class="panel-3d-wrapper">
    <div class="panel-3d">3D 패널</div>
  </div>

  <script>
    const panel = document.querySelector('.panel-3d');
    const maxAngle = 30;

    window.addEventListener('mousemove', e => {
      // 마우스 위치를 -1에서 1까지의 값으로 변경
      const mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      const mouseY = (e.clientY / window.innerHeight) * 2 - 1;
      
      panel.style.transform = `
        rotateY(${maxAngle * mouseX}deg)
        rotateX(${-maxAngle * mouseY}deg)
      `;
    });
  </script>
</body>
</html>
