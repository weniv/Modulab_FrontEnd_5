<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript</title>
</head>
<body>
  <script>
    let color = 'red';

    switch (color) {
      case 'red':
        console.log('빨강');
        break;
      case 'blue':
        console.log('파랑');
        break;
      case 'green':
        console.log('초록');
        break;
      default:
        console.log('기타 색상');
    }
  </script>
</body>
</html>
