<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript</title>
</head>
<body>
  <script>
    function displayName(name) {
      console.log(name);
    }

    function showName(name, callback) {
      setTimeout(function () {
        callback(name);
      }, 2000);
    }

    // displayName(1);
    showName('유미르', displayName);
  </script>
</body>
</html>
