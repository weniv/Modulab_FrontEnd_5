<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript</title>
</head>
<body>
  <script>
    let user = "Tom"; // 전역변수

    function greet() {
      let message = "Hello, " + user; // 지역변수
      console.log(message);
    }

    greet();
    console.log(message);
  </script>
</body>
</html>
