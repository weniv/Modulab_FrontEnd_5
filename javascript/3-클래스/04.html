<body>
  <script>
    // const foo = {

    class Animal {
      constructor({ name = '이름모름', type = '종모름', age = '나이모름' }) {
        // this.name = name || '이름모름';
        // this.type = type || '종모름';
        // this.age = age || '나이모름';
        this.name = name;

    }

    const dog = new Animal({
      age: 17,
      type: '코카스파니엘',

    const dog2 = new Animal({});
