<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    // 즉시 호출 함수(익명)
    (async () => {
      try {
        const res = await fetch('data.json');
        
        if (!res.ok) {
          throw new Error('에러 발생!!!');
        }

        const data = await res.json();
        console.log(data);

      } catch (err) {
        console.error(err);
      }
    })();
  </script>
</body>
</html>
