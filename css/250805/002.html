<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .item {
        width: 150px;
        height: 150px;
        background-color: #eee;

        display: flex;
        justify-content: center;
        align-items: center;

        transition: all 1s;
      }
      .container {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 100px;
      }

      /* transform 요소를 회전, 이동, 크기조절, 기울이는 다양한 변형 */
      .item:nth-child(1):hover {
        background-color: salmon;
        transform: translate(20px, 20px);
        transform: translate(-100px, -50px);
        transform: translate(0, 20px);
        /* %는 자기자신의 크기를 기준 */
        transform: translate(100%, 100%);

        /* x축만, y축만 이동 */
        transform: translateX(120px);
        transform: translateY(-50px);
        transform: translateX(-20px) translateY(50px);

        transform-origin: top left;
      }

      /* 요소의 크기 */
      .item:nth-child(2):hover {
        background-color: gold;

        /* scale에 지정하는 값은 비율 */
        /* 기본크기 1을 기준, 1보다 큰 값 -> 확대, 1보다 작은 값 -> 축소 */
        transform: scale(2);
        transform: scale(0.5);
        /* x방향, y방향 */
        transform: scale(1, 2);
        transform: scale(0.5, 2);

        transform: scaleX(2);
        transform: scaleY(3);
        transform: scale(0.6, 1.4);
        transform: scale(1.5);

        transform-origin: top left;
        transform-origin: bottom right;
      }

      /* 요소의 회전 */
      .item:nth-child(3):hover {
        background-color: yellowgreen;

        /* deg(도), rad(2PI = 360), turn */
        transform: rotate(45deg);
        /* 360도 = 2PIrad */
        transform: rotate(6rad);
        transform: rotate(1turn);
        transform-origin: bottom right;
        transform-origin: 20px 20px;
      }

      .item:nth-child(4):hover {
        background-color: royalblue;

        /* 기울기 */
        /* 텍스트도 같이 기울어짐 */
        transform: skew(30deg);
        transform: skewX(30deg);
        transform: skewY(30deg);
        transform: skew(30deg, 20deg);
        transform-origin: 50px 50px;
        transform-origin: top right;
      }

      .item:nth-child(5):hover {
        background-color: plum;

        /* 여러 개의 변형을 적용하고 싶을 때 */
        /* 변형 함수들을 공백을 구분자로 나열해서 작성 */
        transform: translate(20px, 20px) rotate(2turn) scale(1.5) skew(30deg);
      }
      /* transform은 레이아웃을 수정하지 않는다. */

      /* translate를 이용한 가로 세로 정렬 */
      .absolute {
        width: 250px;
        height: 250px;
        background-color: #eee;
        margin: 100px auto;
        position: relative;
      }
      .absolute .child {
        width: 100px;
        height: 100px;
        background-color: orangered;
        position: absolute;

        /* 부모 요소의 크기를 기준으로 %를 배치 */
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        /* 간단한 모달, 툴팁 기능들을 transform을 이용해서 보다 쉽게 */
      }

      .progress {
        width: 200px;
        height: 20px;
        background-color: #eee;
        margin: auto;
      }
      .bar {
        height: 20px;
        background-color: dodgerblue;

        /* width를 변경 */
        width: 20%;

        /* transform */
        width: 100%;
        transform: scaleX(50%);
        transform-origin: left;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item">이동</div>
      <div class="item">크기조절</div>
      <div class="item">회전</div>
      <div class="item">기울이기</div>
      <div class="item">전체</div>
    </div>

    <div class="absolute">
      <div class="child">child</div>
    </div>

    <div class="progress">
      <div class="bar"></div>
    </div>
  </body>
</html>
