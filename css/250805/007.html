<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .container {
        background-color: pink;

        /* 절대 단위 */
        /* 고정 단위를 사용하게 되면 화면 크기에 따라서 레이아웃이 깨져보일수있음 */
        width: 400px;
        width: 800px;

        /* 화면에 크기에 따라 유동적인 크기 */
        /* calc() */
        width: calc(100% - 32px);
        margin: auto;
        /* max-width: 1200px;
        min-width: 300px; */

        /* max(), min() */
        width: min(50%, 600px);
        width: max(600px, 100%);
        /* clamp(최솟값, 선호값, 최댓값) */
        /* 선호값에 상대 단위(vw, %) */
        /* 선호값이 최솟값보다 작아진다면 -> 최솟값 / 최댓값보다 커진다면 -> 최대값 */
        width: clamp(300px, 50%, 800px);
      }

      .lang-list {
        list-style: none;
        margin: 20px;
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }
      .lang-list li {
        width: max(200px, 30%);
        background-color: skyblue;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <span
        >Lorem ipsum dolor sit amet consectetur adipisicing elit. Quidem
        repellat ipsum reiciendis veniam doloremque ex doloribus veritatis?
        Ipsum, tenetur? Id, optio earum accusamus omnis soluta vitae adipisci
        quibusdam ullam voluptatibus!</span
      >
    </div>

    <ul class="lang-list">
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
    </ul>
  </body>
</html>
