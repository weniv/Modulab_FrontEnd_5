<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      @keyframes rotate {
        0% {
          transform: rotateY(0);
        }
        100% {
          transform: rotateY(360deg);
        }
      }

      * {
        margin: 0;
        padding: 0;
        list-style: none;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        perspective: 1000px;
      }
      .container {
        width: 200px;
        height: 200px;
        position: relative;
        transform-style: preserve-3d;
        animation: rotate 10s linear infinite;
      }

      .container li {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        backface-visibility: hidden;
      }
      .container li::after {
        content: "";
        position: absolute;
        background-color: hotpink;
        inset: 0;
        width: 100%;
        height: 100%;
        transform: rotateY(180deg);
        backface-visibility: hidden;
      }
      .container li img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* 이미지가 총 6개 -> 360도 / 6 = 60도 */
      .container {
        --carousel-radius: calc(200px * 6 / 2 / 3.14 + 100px);
      }
      .container li:nth-child(1) {
        transform: rotateY(calc(360deg / 6 * 0))
          translateZ(var(--carousel-radius));
      }
      .container li:nth-child(2) {
        transform: rotateY(calc(360deg / 6 * 1))
          translateZ(var(--carousel-radius));
      }
      .container li:nth-child(3) {
        transform: rotateY(calc(360deg / 6 * 2))
          translateZ(var(--carousel-radius));
      }
      .container li:nth-child(4) {
        transform: rotateY(calc(360deg / 6 * 3))
          translateZ(var(--carousel-radius));
      }
      .container li:nth-child(5) {
        transform: rotateY(calc(360deg / 6 * 4))
          translateZ(var(--carousel-radius));
      }
      .container li:nth-child(6) {
        transform: rotateY(calc(360deg / 6 * 5))
          translateZ(var(--carousel-radius));
      }
    </style>
  </head>
  <body>
    <ul class="container">
      <li><img src="./images/weniv-binky.png" alt="" /></li>
      <li><img src="./images/weniv-chilli.png" alt="" /></li>
      <li><img src="./images/weniv-garry.png" alt="" /></li>
      <li><img src="./images/weniv-licat.png" alt="" /></li>
      <li><img src="./images/weniv-suri.png" alt="" /></li>
      <li><img src="./images/weniv-wade.png" alt="" /></li>
    </ul>
  </body>
</html>
