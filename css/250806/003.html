<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 100px;

        /* z위치 -> 3D 공간의 깊이 */
        perspective: 100px;
        perspective: 200px;
        perspective: 300px;
        perspective: 400px;

        /* 어디에서 화면의 중심을 바라보는지 결정 */
        /* perspective-origin (x, y) */
        /* perspective-origin: center center;
        perspective-origin: top left;
        perspective-origin: bottom right;
        perspective-origin: 800px -100px; */
      }
      .item {
        width: 100px;
        height: 100px;
        background-color: rgba(255, 0, 0, 0.5);
        border: 1px solid black;

        display: flex;
        justify-content: center;
        align-items: center;

        transform: rotateX(60deg);
        transform: rotateY(45deg);
        transform: rotateZ(30deg);
        transform: rotateX(45deg);

        /* 개별 요소에 원근감 transform: perspective() */
      }
      .item:nth-child(1) {
        transform: perspective(200px) rotateX(45deg);
      }
      .item:nth-child(2) {
        transform: perspective(400px) rotateX(45deg);
      }
      .item:nth-child(3) {
        transform: perspective(800px) rotateY(120deg);
      }
      .item:nth-child(4) {
        /* transform에 perspective 사용할때는 가장 먼저 */
        /* perspective의 앞에 오는 속성에 대해서는 원근감이 적용되지 않는다 */
        transform: rotateY(60deg) perspective(500px) rotateX(60deg);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
      <div class="item">5</div>
    </div>
  </body>
</html>
