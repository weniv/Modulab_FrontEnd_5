<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        width: 300px;
        height: 200px;
        /* 그라데이션 */
        background: linear-gradient(45deg, red 50%, blue, green);
        background: radial-gradient(red 50%, blue, green);
        background: #eeaeca;
        background: radial-gradient(
          circle,
          rgba(238, 174, 202, 1) 0%,
          rgba(218, 177, 209, 1) 22%,
          rgba(199, 180, 215, 1) 43%,
          rgba(181, 183, 221, 1) 63%,
          rgba(171, 184, 224, 1) 74%,
          rgba(148, 187, 233, 1) 100%
        );
        background: #2a7b9b;
        background: linear-gradient(
          90deg,
          rgba(42, 123, 155, 1) 0%,
          rgba(87, 199, 133, 1) 50%,
          rgba(237, 221, 83, 1) 100%
        );
      }
    </style>
  </head>
  <body>
    <div class="box"></div>
  </body>
</html>
